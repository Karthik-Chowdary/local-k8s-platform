apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jellyfin
  namespace: argocd
  labels:
    app.kubernetes.io/managed-by: argo-marketplace
spec:
  project: default
  source:
    repoURL: https://bjw-s-labs.github.io/helm-charts
    chart: app-template
    targetRevision: 4.4.0
    helm:
      releaseName: jellyfin
      values: |
        controllers:
          jellyfin:
            type: statefulset
            pod:
              nodeSelector:
                kubernetes.io/hostname: ubuntu4u
              securityContext:
                runAsUser: 1000
                runAsGroup: 988
                fsGroup: 988
                supplementalGroups: [988]
            initContainers:
              # Idempotent install of the SSO-Auth plugin into the config PVC.
              # If the DLL is already present, this exits 0 immediately —
              # safe to re-run on every pod start, never touches the
              # plugin's XML config under /config/plugins/configurations/.
              install-sso-plugin:
                image:
                  repository: python
                  tag: "3.12-alpine"
                command: ["python3", "-c"]
                args:
                  - |
                    import urllib.request, zipfile, os, hashlib, sys
                    VERSION = "3.5.2.4"
                    URL = f"https://github.com/9p4/jellyfin-plugin-sso/releases/download/v{VERSION}/sso-authentication_{VERSION}.zip"
                    SHA256 = "f0341638f87a3596105057e32a8b18409f1c15a4449fda0c1e3010d7543e9c28"
                    DEST = f"/config/plugins/SSO Authentication_{VERSION}"
                    MARKER = f"{DEST}/SSO-Auth.dll"
                    if os.path.exists(MARKER):
                        print(f"plugin {VERSION} already present, skipping")
                        sys.exit(0)
                    print(f"downloading {URL}")
                    zip_path = "/tmp/sso.zip"
                    urllib.request.urlretrieve(URL, zip_path)
                    h = hashlib.sha256(open(zip_path, "rb").read()).hexdigest()
                    if h != SHA256:
                        print(f"checksum mismatch: got {h}, expected {SHA256}", file=sys.stderr)
                        sys.exit(1)
                    os.makedirs(DEST, exist_ok=True)
                    with zipfile.ZipFile(zip_path) as z:
                        z.extractall(DEST)
                    print(f"installed plugin {VERSION} -> {DEST}")
            containers:
              app:
                image:
                  repository: jellyfin/jellyfin
                  tag: "10.10.7"
                env:
                  TZ: America/Los_Angeles
                  JELLYFIN_PublishedServerUrl: https://media.karthikchowdary.com
                  # Hardware-accel: tells Jellyfin's ffmpeg to use NVENC/NVDEC
                  NVIDIA_VISIBLE_DEVICES: all
                  NVIDIA_DRIVER_CAPABILITIES: compute,video,utility
                resources:
                  requests:
                    cpu: 200m
                    memory: 512Mi
                  limits:
                    nvidia.com/gpu: 1
                    memory: 4Gi
                probes:
                  liveness:
                    enabled: true
                    custom: true
                    spec:
                      httpGet:
                        path: /health
                        port: 8096
                      initialDelaySeconds: 30
                      periodSeconds: 30
                  readiness:
                    enabled: true
                    custom: true
                    spec:
                      httpGet:
                        path: /health
                        port: 8096
                      initialDelaySeconds: 10
                      periodSeconds: 10

        service:
          app:
            controller: jellyfin
            ports:
              http:
                port: 8096

        ingress:
          app:
            className: nginx
            annotations:
              nginx.ingress.kubernetes.io/proxy-body-size: "0"
              nginx.ingress.kubernetes.io/proxy-buffering: "off"
              nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
              nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
              nginx.ingress.kubernetes.io/ssl-redirect: "false"
            hosts:
              - host: media.karthikchowdary.com
                paths:
                  - path: /
                    pathType: Prefix
                    service:
                      identifier: app
                      port: http
            tls:
              - secretName: karthikchowdary-wildcard-tls
                hosts:
                  - media.karthikchowdary.com

        persistence:
          # Jellyfin's SQLite DB lives here — local NVMe, NOT NFS
          config:
            enabled: true
            storageClass: local-path
            accessMode: ReadWriteOnce
            size: 20Gi
            globalMounts:
              - path: /config
          # Media library from UNAS, read-only
          media:
            type: nfs
            server: 192.168.0.38
            path: /var/nfs/shared/unas/media
            globalMounts:
              - path: /media
                readOnly: true
          # Transcode scratch — in-memory tmpfs, zero disk wear, fastest
          # Bump sizeLimit if you'll have many concurrent transcodes
          transcode:
            type: emptyDir
            medium: Memory
            sizeLimit: 4Gi
            globalMounts:
              - path: /config/transcodes
          cache:
            type: emptyDir
            sizeLimit: 4Gi
            globalMounts:
              - path: /cache
  destination:
    server: https://kubernetes.default.svc
    namespace: jellyfin
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
