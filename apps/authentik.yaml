apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authentik
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/managed-by: local-k8s-platform
spec:
  project: default
  source:
    repoURL: https://charts.goauthentik.io
    chart: authentik
    targetRevision: "2026.2.2"
    helm:
      releaseName: authentik
      values: |
        # Secret values (AUTHENTIK_SECRET_KEY, bootstrap creds, postgres password)
        # are provided out-of-band via the `authentik-secrets` Kubernetes Secret.
        # See: kubectl -n authentik get secret authentik-secrets

        global:
          nodeSelector:
            kubernetes.io/hostname: ubuntu4u
          # envFrom applies to server + worker (not geoip)
          envFrom:
            - secretRef:
                name: authentik-secrets

        authentik:
          log_level: info
          error_reporting:
            enabled: false
          postgresql:
            host: "authentik-postgresql"
            name: authentik
            user: authentik
            port: 5432
            # password is sourced via env AUTHENTIK_POSTGRESQL__PASSWORD from the secret

        server:
          replicas: 1
          ingress:
            enabled: true
            ingressClassName: nginx
            annotations:
              nginx.ingress.kubernetes.io/ssl-redirect: "false"
              nginx.ingress.kubernetes.io/proxy-body-size: "4m"
            hosts:
              - auth.karthikchowdary.com
            paths:
              - "/"
            pathType: Prefix
            tls:
              - secretName: karthikchowdary-wildcard-tls
                hosts:
                  - auth.karthikchowdary.com
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: 1000m
              memory: 1Gi

        worker:
          replicas: 1
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: 1000m
              memory: 1Gi

        postgresql:
          enabled: true
          auth:
            existingSecret: authentik-postgres-secret
            secretKeys:
              adminPasswordKey: postgres-password
              userPasswordKey: password
            username: authentik
            database: authentik
          primary:
            nodeSelector:
              kubernetes.io/hostname: ubuntu4u
            persistence:
              enabled: true
              # local-path avoids NFS root_squash; postgres is pinned to ubuntu4u anyway
              storageClass: local-path
              size: 4Gi
              accessModes:
                - ReadWriteOnce
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 500m
                memory: 512Mi

  destination:
    server: https://kubernetes.default.svc
    namespace: authentik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
