apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redis
  namespace: argocd
  labels:
    app.kubernetes.io/managed-by: argo-marketplace
    marketplace.argo/chart: redis
    marketplace.argo/repo: cloudpirates-redis
spec:
  project: default
  source:
    repoURL: https://charts.bitnami.com/bitnami
    chart: redis
    targetRevision: "20.11.3"
    helm:
      values: |
        global:
          # Bitnami moved images from Docker Hub to their own registry
          imageRegistry: registry.bitnami.com
          security:
            allowInsecureImages: true
        architecture: standalone
        auth:
          enabled: false
        master:
          persistence:
            enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: redis
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
