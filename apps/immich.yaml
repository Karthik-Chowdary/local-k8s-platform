apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: immich
  namespace: argocd
  labels:
    app.kubernetes.io/managed-by: argo-marketplace
spec:
  project: default
  source:
    repoURL: https://immich-app.github.io/immich-charts
    chart: immich
    targetRevision: 0.10.3
    helm:
      values: |
        controllers:
          main:
            containers:
              main:
                env:
                  DB_HOSTNAME: immich-postgres-postgresql.immich.svc.cluster.local
                  DB_PORT: "5432"
                  DB_USERNAME: immich
                  DB_PASSWORD: immich
                  DB_DATABASE_NAME: immich

        immich:
          persistence:
            library:
              existingClaim: immich-library

        valkey:
          enabled: true

        server:
          # OAuth via Authentik. The ConfigMap below is a *template*: Immich does NOT
          # expand ${VAR} in IMMICH_CONFIG_FILE, so the `render-config` init container
          # substitutes the client ID/secret from the `immich-oauth-authentik` Secret
          # (created out-of-band, see BOOTSTRAP.md) into an in-memory /config/immich.json.
          configMaps:
            oauth-config:
              enabled: true
              data:
                immich.json: |
                  {
                    "oauth": {
                      "enabled": true,
                      "issuerUrl": "https://auth.karthikchowdary.com/application/o/immich/",
                      "clientId": "${IMMICH_OAUTH_CLIENT_ID}",
                      "clientSecret": "${IMMICH_OAUTH_CLIENT_SECRET}",
                      "buttonText": "Sign in with Authentik",
                      "autoRegister": true,
                      "autoLaunch": false,
                      "scope": "openid email profile",
                      "signingAlgorithm": "RS256",
                      "profileSigningAlgorithm": "none",
                      "storageLabelClaim": "preferred_username",
                      "storageQuotaClaim": "immich_quota",
                      "roleClaim": "immich_role",
                      "mobileOverrideEnabled": false,
                      "mobileRedirectUri": "",
                      "tokenEndpointAuthMethod": "client_secret_post",
                      "defaultStorageQuota": null,
                      "timeout": 30000
                    }
                  }
          controllers:
            main:
              pod:
                nodeSelector:
                  kubernetes.io/hostname: ubuntu4u
              initContainers:
                render-config:
                  image:
                    repository: busybox
                    tag: "1.36"
                  envFrom:
                    - secretRef:
                        name: immich-oauth-authentik
                  command:
                    - sh
                    - -c
                    - |
                      set -eu
                      sed -e "s|\${IMMICH_OAUTH_CLIENT_ID}|${IMMICH_OAUTH_CLIENT_ID}|" \
                          -e "s|\${IMMICH_OAUTH_CLIENT_SECRET}|${IMMICH_OAUTH_CLIENT_SECRET}|" \
                          /template/immich.json > /config/immich.json
                      if grep -q 'IMMICH_OAUTH_' /config/immich.json; then echo "placeholder left in immich.json" >&2; exit 1; fi
              containers:
                main:
                  image:
                    tag: v3.3.5
                  env:
                    IMMICH_CONFIG_FILE: /config/immich.json
                  envFrom:
                    - secretRef:
                        name: immich-oauth-authentik
          persistence:
            oauth-config:
              enabled: true
              type: configMap
              name: immich-server
              advancedMounts:
                main:
                  render-config:
                    - path: /template
                      readOnly: true
            rendered-config:
              enabled: true
              type: emptyDir
              medium: Memory
              advancedMounts:
                main:
                  render-config:
                    - path: /config
                  main:
                    - path: /config
                      readOnly: true
          ingress:
            main:
              enabled: true
              ingressClassName: nginx
              annotations:
                nginx.ingress.kubernetes.io/proxy-body-size: "0"
                nginx.ingress.kubernetes.io/ssl-redirect: "false"
              tls:
                - secretName: karthikchowdary-wildcard-tls
                  hosts:
                    - immich.karthikchowdary.com
              hosts:
                - host: immich.karthikchowdary.com
                  paths:
                    - path: /
                      service:
                        identifier: main

        machine-learning:
          controllers:
            main:
              pod:
                nodeSelector:
                  kubernetes.io/hostname: ubuntu4u
              containers:
                main:
                  image:
                    tag: v3.3.5-cuda
                  resources:
                    limits:
                      nvidia.com/gpu: 1
          persistence:
            cache:
              enabled: true
              size: 10Gi
              type: emptyDir
  destination:
    server: https://kubernetes.default.svc
    namespace: immich
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
