apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    targetRevision: "69.8.0"
    chart: kube-prometheus-stack
    helm:
      releaseName: kube-prometheus-stack
      skipCrds: false
      values: |
        # ---- Grafana ----
        grafana:
          enabled: true
          adminPassword: admin
          ingress:
            enabled: true
            ingressClassName: nginx
            annotations:
              nginx.ingress.kubernetes.io/ssl-redirect: "false"
            hosts:
              - grafana.karthikchowdary.com
            tls:
              - secretName: karthikchowdary-wildcard-tls
                hosts:
                  - grafana.karthikchowdary.com
          # NFS storage — works fine since pod is pinned to ubuntu4u (x86)
          persistence:
            enabled: true
            storageClassName: nfs-client
            accessModes:
              - ReadWriteOnce
            size: 2Gi
          # Pin to ubuntu4u — avoids ARM nodes where NFS init-chown fails
          nodeSelector:
            kubernetes.io/hostname: ubuntu4u
          # Skip chown init container — NFS server handles permissions
          initChownData:
            enabled: false
          # Sidecar for dashboard auto-discovery
          sidecar:
            dashboards:
              enabled: true
              searchNamespace: ALL
            datasources:
              enabled: true
          # Lower resources for local
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          # Subpath config so redirects go to /grafana/... not /...
          grafana.ini:
            server:
              root_url: "https://grafana.karthikchowdary.com"
              serve_from_sub_path: false
          # Additional dashboard providers (ArgoCD)
          dashboardProviders:
            dashboardproviders.yaml:
              apiVersion: 1
              providers:
                - name: argocd
                  orgId: 1
                  folder: ArgoCD
                  type: file
                  disableDeletion: false
                  editable: true
                  options:
                    path: /var/lib/grafana/dashboards/argocd
          dashboards:
            argocd:
              argocd-dashboard:
                gnetId: 14584
                revision: 1
                datasource: Prometheus

        # ---- Prometheus ----
        prometheus:
          prometheusSpec:
            externalUrl: "https://prometheus.karthikchowdary.com"
            routePrefix: /
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi
            # Scrape all ServiceMonitors
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            # Persistent storage on NFS — survives restarts
            retention: 7d
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: nfs-client
                  accessModes:
                    - ReadWriteOnce
                  resources:
                    requests:
                      storage: 10Gi
          ingress:
            enabled: true
            ingressClassName: nginx
            annotations:
              nginx.ingress.kubernetes.io/ssl-redirect: "false"
            hosts:
              - prometheus.karthikchowdary.com
            tls:
              - secretName: karthikchowdary-wildcard-tls
                hosts:
                  - prometheus.karthikchowdary.com

        # ---- Alertmanager ----
        alertmanager:
          ingress:
            enabled: true
            ingressClassName: nginx
            annotations:
              nginx.ingress.kubernetes.io/ssl-redirect: "false"
            hosts:
              - alertmanager.karthikchowdary.com
            tls:
              - secretName: karthikchowdary-wildcard-tls
                hosts:
                  - alertmanager.karthikchowdary.com
          alertmanagerSpec:
            externalUrl: "https://alertmanager.karthikchowdary.com"
            routePrefix: /
            resources:
              requests:
                cpu: 25m
                memory: 64Mi
              limits:
                memory: 256Mi
            storage:
              volumeClaimTemplate:
                spec:
                  storageClassName: nfs-client
                  accessModes:
                    - ReadWriteOnce
                  resources:
                    requests:
                      storage: 1Gi

        # ---- Node Exporter ----
        nodeExporter:
          enabled: true
        prometheus-node-exporter:
          # Use port 9110 instead of default 9100 to avoid stale-socket collisions.
          # When containerd leaves orphaned node_exporter processes after crashes,
          # they hold port 9100 and block the new pod. Using a non-default port
          # sidesteps this entirely without needing fragile init containers.
          service:
            port: 9110
            targetPort: 9110
          extraArgs:
            - --web.listen-address=:9110
            - --collector.disable-defaults
            - --collector.cpu
            - --collector.meminfo
            - --collector.diskstats
            - --collector.filesystem
            - --collector.loadavg
            - --collector.netdev
            - --collector.stat
            - --collector.time
            - --collector.uname
            - --collector.vmstat

        # ---- Kube State Metrics ----
        kubeStateMetrics:
          enabled: true

        # ---- Default rules ----
        defaultRules:
          create: true
          rules:
            alertmanager: true
            etcd: false
            configReloaders: true
            general: true
            k8s: true
            kubeApiserverAvailability: true
            kubeApiserverBurnrate: true
            kubeApiserverHistogram: true
            kubeApiserverSlos: true
            kubeControllerManager: false
            kubelet: true
            kubeProxy: false
            kubePrometheusGeneral: true
            kubePrometheusNodeRecording: true
            kubernetesApps: true
            kubernetesResources: true
            kubernetesStorage: true
            kubernetesSystem: true
            kubeScheduler: false
            kubeStateMetrics: true
            network: true
            node: true
            nodeExporterAlerting: true
            nodeExporterRecording: true
            prometheus: true
            prometheusOperator: true

        # Disable components not available in k3s
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeProxy:
          enabled: false
        kubeEtcd:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
