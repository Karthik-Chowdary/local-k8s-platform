apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: "v1.17.1"
    helm:
      releaseName: cert-manager
      values: |
        crds:
          enabled: true
        # Pin to ubuntu4u (x86) — ARM node has kubelet API issues
        nodeSelector:
          kubernetes.io/hostname: ubuntu4u
        webhook:
          nodeSelector:
            kubernetes.io/hostname: ubuntu4u
        cainjector:
          nodeSelector:
            kubernetes.io/hostname: ubuntu4u
        # Mount host CA bundle so ACME TLS verification works
        volumes:
          - name: host-ssl
            hostPath:
              path: /etc/ssl/certs
              type: Directory
        volumeMounts:
          - name: host-ssl
            mountPath: /etc/ssl/certs
            readOnly: true
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            memory: 256Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
