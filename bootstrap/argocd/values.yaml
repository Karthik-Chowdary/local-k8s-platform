# ArgoCD Helm values — optimized for local development
# Chart: argo-cd (https://github.com/argoproj/argo-helm/tree/main/charts/argo-cd)

global:
  domain: argocd.karthikchowdary.com

# -- Server configuration
server:
  # Run insecure — TLS terminated at Cloudflare/ingress
  extraArgs:
    - --insecure

  # Pin to ubuntu4u — k3s-node2 ARM has flannel IP exhaustion from crash loops
  nodeSelector:
    kubernetes.io/hostname: ubuntu4u

  ingress:
    enabled: true
    ingressClassName: nginx
    hostname: argocd.karthikchowdary.com
    annotations:
      nginx.ingress.kubernetes.io/backend-protocol: HTTP
      nginx.ingress.kubernetes.io/ssl-redirect: "false"
      # ArgoCD v3 defaults to /argocd — redirect root to it
      nginx.ingress.kubernetes.io/app-root: /argocd
    tls: true
    extraTls:
      - secretName: karthikchowdary-wildcard-tls
        hosts:
          - argocd.karthikchowdary.com

  # Lower resource requests for local
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

# -- Controller
controller:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

# -- Repo Server
repoServer:
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 1Gi

# -- ApplicationSet Controller
applicationSet:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 256Mi

# -- Notifications (disabled for local)
notifications:
  enabled: false

# -- Dex (disabled — use built-in auth for local)
dex:
  enabled: false

# -- Redis
redis:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 128Mi

configs:
  params:
    # Run insecure — local only
    server.insecure: true
    # ArgoCD v3 default — serve UI at /argocd (nginx redirects / → /argocd)
    server.basehref: /argocd
    server.rootpath: /argocd
  cm:
    # Allow status badges
    statusbadge.enabled: "true"
    # Track resources in all namespaces
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Healthy"
      hs.message = ""
      if obj.status ~= nil then
        if obj.status.health ~= nil then
          hs.status = obj.status.health.status
          if obj.status.health.message ~= nil then
            hs.message = obj.status.health.message
          end
        end
      end
      return hs
